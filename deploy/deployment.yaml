apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # shortcut: one worker serializes demo mutations; add distributed transactions before scaling writes.
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "bumblebee"
            - name: DETOUR_STORE
              value: elasticsearch
            - name: DETOUR_PUBLIC_ORIGIN
              value: https://bumblebee.cnh.radarhq.io
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: detour-credentials
                  key: ELASTICSEARCH_URL
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: detour-credentials
                  key: ELASTICSEARCH_API_KEY
            - name: ELASTICSEARCH_INFERENCE_ID
              value: .jina-embeddings-v5-text-small
            - name: OTEL_SERVICE_NAME
              value: detour-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: detour-credentials
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: detour-credentials
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
